[package]
name = "rust_web_sanitizer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
lol_html = "3.0.1"
reqwest = { version = "0.13.4", features = ["blocking"] } 
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"